<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>꽃돼지 연이 vs 청토끼 — Yeon the Killer of Blue Zombie</title>
    <meta name="description" content="청토끼 변이체 무리 속에서 살아남는 그로테스크 서바이벌 슈터">
    <meta name="theme-color" content="#0b0507">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Yeon Zombie">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="preload" href="asset/sprites/player.webp" as="image">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <canvas id="game"></canvas>

        <!-- 로딩 -->
        <section id="loading" class="screen">
            <div class="loading-box">
                <div class="drip-title">감염 확산 중...</div>
                <div class="flesh-bar"><div id="loading-fill" class="flesh-fill"></div></div>
                <div id="loading-text" class="small-text">0%</div>
            </div>
        </section>

        <!-- 타이틀 -->
        <section id="title" class="screen" hidden>
            <div class="title-wrap">
                <div class="title-art"><img src="asset/ui/title.webp" alt="" width="343" height="512"></div>
                <div class="title-menu panel">
                    <h1 class="game-title"><span class="t-kr">꽃돼지 연이</span><span class="t-vs">VS</span><span class="t-kr blue">청토끼</span></h1>
                    <p class="game-sub">THE KILLER OF BLUE ZOMBIE</p>
                    <div class="menu-buttons">
                        <button id="btn-new" class="btn btn-blood" type="button">새 게임</button>
                        <button id="btn-continue" class="btn" type="button" hidden>이어하기</button>
                        <button id="btn-shop" class="btn" type="button">강화 상점</button>
                        <button id="btn-settings" class="btn" type="button">설정</button>
                        <button id="btn-install" class="btn btn-ghost" type="button" hidden>📲 앱 설치</button>
                    </div>
                    <div id="title-record" class="small-text record"></div>
                    <details id="secret" class="secret">
                        <summary>🔐 SECRET CODE</summary>
                        <div class="secret-body">
                            <input id="secret-input" type="password" inputmode="numeric" maxlength="6" placeholder="연이의 생년월일 6자리" autocomplete="off">
                            <button id="secret-submit" class="btn btn-small" type="button">해제</button>
                            <div id="secret-error" class="error-text" hidden>코드가 틀렸습니다</div>
                        </div>
                        <div id="dev-panel" class="dev-panel" hidden>
                            <div class="small-text">스테이지 선택</div>
                            <div id="stage-grid" class="stage-grid"></div>
                            <label class="check"><input id="dev-god" type="checkbox" checked> 무적 모드</label>
                        </div>
                    </details>
                </div>
            </div>
        </section>

        <!-- 스토리 -->
        <section id="story" class="screen story-screen" hidden>
            <div class="story-panel panel">
                <div id="story-head" class="story-head"></div>
                <div id="story-text" class="story-text" tabindex="0"></div>
                <div class="story-actions">
                    <button id="story-skip" class="btn btn-ghost btn-small" type="button">건너뛰기</button>
                    <button id="story-next" class="btn btn-blood btn-small" type="button">계속 ▶</button>
                </div>
            </div>
        </section>

        <!-- 인게임 버튼 -->
        <button id="btn-pause" class="pause-btn" type="button" aria-label="일시정지" hidden>❚❚</button>
        <div id="banner" class="banner" hidden></div>

        <!-- 레벨업 -->
        <section id="levelup" class="modal" hidden>
            <div class="modal-box levelup-box">
                <h2 class="modal-title drip">변이 선택 <small id="levelup-lv">LV 2</small></h2>
                <div id="cards" class="cards"></div>
                <div class="modal-actions">
                    <button id="btn-reroll" class="btn btn-small" type="button">🎲 리롤</button>
                    <button id="btn-skip" class="btn btn-ghost btn-small" type="button">넘기기 (+골드)</button>
                </div>
            </div>
        </section>

        <!-- 관 상자 -->
        <section id="chest" class="modal" hidden>
            <div class="modal-box chest-box">
                <h2 class="modal-title drip" id="chest-title">피 묻은 관</h2>
                <div id="coffin" class="coffin"><div class="coffin-lid"></div><div class="coffin-body"></div></div>
                <div id="rewards" class="rewards"></div>
                <div class="modal-actions">
                    <button id="btn-chest" class="btn btn-blood" type="button">열기</button>
                </div>
            </div>
        </section>

        <!-- 일시정지 -->
        <section id="pause" class="modal" hidden>
            <div class="modal-box small-box">
                <h2 class="modal-title drip">일시정지</h2>
                <div id="pause-build" class="pause-build"></div>
                <div class="menu-buttons">
                    <button id="btn-resume" class="btn btn-blood" type="button">계속하기</button>
                    <button id="btn-pause-settings" class="btn" type="button">설정</button>
                    <button id="btn-quit" class="btn btn-ghost" type="button">타이틀로</button>
                </div>
            </div>
        </section>

        <!-- 설정 -->
        <section id="settings" class="modal" hidden>
            <div class="modal-box small-box">
                <h2 class="modal-title drip">설정</h2>
                <div class="settings-list">
                    <div class="setting-row">
                        <span>고어 수위</span>
                        <div class="seg" data-key="gore">
                            <button type="button" data-v="off">끔</button>
                            <button type="button" data-v="normal">보통</button>
                            <button type="button" data-v="max">최대</button>
                        </div>
                    </div>
                    <div class="setting-row">
                        <span>그래픽 품질</span>
                        <div class="seg" data-key="quality">
                            <button type="button" data-v="auto">자동</button>
                            <button type="button" data-v="high">높음</button>
                            <button type="button" data-v="low">낮음</button>
                        </div>
                    </div>
                    <label class="setting-row"><span>화면 흔들림</span><input type="checkbox" data-key="shake"></label>
                    <label class="setting-row"><span>번쩍임 효과</span><input type="checkbox" data-key="flash"></label>
                    <label class="setting-row"><span>데미지 숫자</span><input type="checkbox" data-key="damageNumbers"></label>
                    <label class="setting-row"><span>배경음</span><input type="range" min="0" max="1" step="0.05" data-key="bgm"></label>
                    <label class="setting-row"><span>효과음</span><input type="range" min="0" max="1" step="0.05" data-key="sfx"></label>
                </div>
                <div class="modal-actions">
                    <button id="btn-settings-close" class="btn btn-blood btn-small" type="button">닫기</button>
                </div>
            </div>
        </section>

        <!-- 상점 -->
        <section id="shop" class="modal" hidden>
            <div class="modal-box">
                <h2 class="modal-title drip">강화 상점 <small id="shop-gold">● 0</small></h2>
                <div id="shop-list" class="shop-list"></div>
                <div class="modal-actions">
                    <button id="btn-shop-close" class="btn btn-blood btn-small" type="button">닫기</button>
                </div>
            </div>
        </section>

        <!-- 게임 오버 -->
        <section id="gameover" class="screen result-screen" hidden>
            <div class="result-panel panel">
                <h2 class="died-title">연이가 쓰러졌다</h2>
                <img class="result-img" src="asset/ui/gameover.webp" alt="" width="442" height="63">
                <p id="gameover-lore" class="lore"></p>
                <div id="gameover-stats" class="stats"></div>
                <div class="menu-buttons row">
                    <button id="btn-retry" class="btn btn-blood" type="button">⚔ 이 스테이지 재도전</button>
                    <button id="btn-gameover-title" class="btn btn-ghost" type="button">타이틀로</button>
                </div>
            </div>
        </section>

        <!-- 스테이지 클리어 -->
        <section id="clear" class="screen result-screen" hidden>
            <div class="result-panel panel">
                <h2 id="clear-title" class="result-title">STAGE 1 CLEAR</h2>
                <div id="clear-stats" class="stats"></div>
                <div class="menu-buttons row">
                    <button id="btn-next" class="btn btn-blood" type="button">다음 지옥으로 ▶</button>
                </div>
            </div>
        </section>

        <!-- 엔딩 -->
        <section id="ending" class="screen result-screen" hidden>
            <div class="result-panel panel">
                <img class="ending-img" src="asset/ui/clear.webp" alt="GAME CLEAR" width="512" height="196">
                <h2 class="result-title gold">REQUIEM FOR THE PINK DAWN</h2>
                <div id="ending-stats" class="stats"></div>
                <div class="menu-buttons row">
                    <button id="btn-ending-title" class="btn btn-blood" type="button">타이틀로</button>
                </div>
            </div>
        </section>

        <!-- 설치 안내 -->
        <section id="install" class="modal" hidden>
            <div class="modal-box small-box">
                <h2 class="modal-title">📲 앱 설치</h2>
                <div id="install-body" class="install-body"></div>
                <div class="modal-actions">
                    <button id="btn-install-close" class="btn btn-small" type="button">닫기</button>
                </div>
            </div>
        </section>

        <div id="toast" class="toast" hidden></div>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
